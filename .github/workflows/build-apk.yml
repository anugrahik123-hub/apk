name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract latest Google AI Studio zip
        run: |
          mkdir -p project
          ZIP_FILE=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Selected zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app_raw

          GRADLE_FILE=$(find app_raw -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            SRC_DIR=$(dirname "$GRADLE_FILE")
          else
            PKG_FILE=$(find app_raw -maxdepth 3 -name "package.json" | head -n 1)
            SRC_DIR=$(dirname "$PKG_FILE")
          fi

          echo "Project root: $SRC_DIR"
          cp -a "$SRC_DIR"/. project/

      - name: Build Debug APK
        working-directory: project
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          else
            npm install --legacy-peer-deps
            npm run build || npx vite build
            WEB_DIR="dist"
            [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
            npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
            npx cap init "Claude Code Studio" "com.anugrah.claudecodestudio" --web-dir="$WEB_DIR"
            npx cap add android
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
            npx cap sync android
            cd android && chmod +x gradlew && ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
