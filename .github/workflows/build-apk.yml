name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract latest Google AI Studio zip
        run: |
          mkdir -p app
          ZIP_FILE=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Selected zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app_raw
          find app_raw -maxdepth 4

          PKG_FILE=$(find app_raw -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            SRC_DIR=$(dirname "$PKG_FILE")
            echo "Found package.json in: $SRC_DIR"
            cp -a "$SRC_DIR"/. app/
          else
            HTML_FILE=$(find app_raw -name "index.html" | head -n 1)
            SRC_DIR=$(dirname "$HTML_FILE")
            echo "No package.json found; packaging static web app from: $SRC_DIR"
            mkdir -p app/dist
            cp -a "$SRC_DIR"/. app/dist/
          fi

      - name: Build web app & wrap with Capacitor
        working-directory: app
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build || npx vite build
          fi
          WEB_DIR="dist"
          [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
          [ ! -f "package.json" ] && npm init -y
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Claude Code Studio" "com.anugrah.claudecodestudio" --web-dir="$WEB_DIR"
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Studio-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
