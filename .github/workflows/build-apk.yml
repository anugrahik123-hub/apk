name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract latest Google AI Studio zip
        run: |
          mkdir -p project
          ZIP_FILE=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Selected zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app_raw

          GRADLE_FILE=$(find app_raw -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          SRC_DIR=$(dirname "$GRADLE_FILE")
          echo "Project root: $SRC_DIR"
          cp -a "$SRC_DIR"/. project/

      - name: Generate debug keystore & Build APK
        working-directory: project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          rm -f debug.keystore
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat << 'EOF' >> app/build.gradle.kts

          android {
              signingConfigs {
                  create("ciDebug") {
                      storeFile = rootProject.file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("ciDebug")
                  }
              }
          }
          EOF

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
