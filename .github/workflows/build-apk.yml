name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract latest Google AI Studio zip
        run: |
          mkdir -p project
          ZIP_FILE=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Selected zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app_raw

          GRADLE_FILE=$(find app_raw -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          SRC_DIR=$(dirname "$GRADLE_FILE")
          echo "Project root: $SRC_DIR"
          cp -a "$SRC_DIR"/. project/

      - name: Generate debug keystore & Build APK
        working-directory: project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f "debug.keystore" ]; then
            STORE_PASS=$(grep -E 'storePassword\s*=' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            KEY_ALIAS=$(grep -E 'keyAlias\s*=' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            KEY_PASS=$(grep -E 'keyPassword\s*=' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            STORE_PASS=${STORE_PASS:-android}
            KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}
            KEY_PASS=${KEY_PASS:-$STORE_PASS}
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
