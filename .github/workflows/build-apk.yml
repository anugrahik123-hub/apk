name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract latest Google AI Studio zip
        run: |
          mkdir -p app
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          echo "Extracting $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app
          if [ ! -f app/package.json ]; then
            SUBDIR=$(find app -maxdepth 2 -name package.json -exec dirname {} \; | head -n 1)
            mv "$SUBDIR"/* "$SUBDIR"/.[!.]* app/ 2>/dev/null || true
          fi

      - name: Build web app & wrap with Capacitor
        working-directory: app
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build
          WEB_DIR="dist"
          [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Claude Code Studio" "com.anugrah.claudecodestudio" --web-dir="$WEB_DIR"
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Studio-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          
